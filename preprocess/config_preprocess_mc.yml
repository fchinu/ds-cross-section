outdir: 'preprocess' # outputs go to <outdir>/data/pt_X_Y

# pt bins
ptbins: [
    0.,
    0.5,
    1.0,
    1.5,
    2.0,
    2.5,
    3.0,
    3.5,
    4.0,
    4.5,
    5.0,
    5.5,
    6.0,
    6.5,
    7.0,
    8.0,
    9.0,
    10.0,
    12.0,
    16.0,
    24.0
]

preprocess:
    bkg_cuts: [
        0.2, # 0., 
        0.2, # 0.5, 
        0.2, # 1.0, 
        0.2, # 1.5, 
        0.2, # 2.0, 
        0.2, # 2.5, 
        0.2, # 3.0, 
        0.2, # 3.5, 
        0.3, # 4.0, 
        0.3, # 4.5, 
        0.3, # 5.0, 
        0.3, # 5.5, 
        0.3, # 6.0, 
        0.3, # 6.5, 
        0.3, # 7.0, 
        0.3, # 8.0, 
        0.3, # 9.0, 
        0.3, # 10.0, 
        0.5, # 12.0,
        0.5, # 16.0,
    ]
    axes:
        axis_pt_reco: 1
        axis_bkg_reco: 3
        axis_ptb_reco: 7 # non-prompt sparses only
        axis_pt_gen: 0
        axis_ptb_gen: 4 # non-prompt sparses only
    input:
        files: [inputs/mc/Train772253/AnalysisResults_LHC24h1d_0.root]
        is_mc: True
        lumi:
            histogram: eventselection-run3/luminosity/hLumiTVXafterBCcutsRCT
            rct_flag: CBT_hadronPID # row of the luminosity histogram
            mc_visible_cross_section: 59.5 # used to compute the luminosity histogram
            vdm_visible_cross_section: 54.0
            collision_selection: # bins of the collision histogram: luminosity scaled by numerator / denominator
                numerator: 'PV #it{z}'
                denominator: 'PV #it{#chi}^{2}'
        collision_histogram: hf-candidate-creator-3prong/hCollisions
        sparses:
        -   type: reco
            path: hf-task-ds/Data/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Ds/Prompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Ds/NonPrompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Dplus/Prompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Dplus/NonPrompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Dplus/Bkg/hSparseMass
        -   type: gen
            path: hf-task-ds/MC/Ds/Prompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Ds/NonPrompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Dplus/Prompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Dplus/NonPrompt/hSparseGen

    weights:
        pt: # prompt weighted vs D pT, non-prompt vs pT(B); adds <sparse>_reweighted next to each MC sparse
            apply: False
            file_name: ''
            hist_names:
                Ds:
                    Prompt: ''
                    NonPrompt: ''
                Dplus:
                    Prompt: ''
                    NonPrompt: ''
