preprocess:
    bkg_cuts: [
        0.1, # 0.,
        0.1, # 0.5,
        0.1, # 1.0,
        0.1, # 1.5,
        0.1, # 2.0,
        0.1, # 2.5,
        0.1, # 3.0,
        0.1, # 3.5,
        0.2, # 4.0,
        0.2, # 4.5,
        0.2, # 5.0,
        0.2, # 5.5,
        0.2, # 6.0,
        0.2, # 6.5,
