        0.2, # 8.0,
        0.2, # 9.0,
        0.2, # 10.0,
        0.3, # 12.0,
        0.3, # 16.0,
    ]
    axes:
        axis_pt_reco: 1
        axis_bkg_reco: 3
        axis_ptb_reco: 7 # non-prompt sparses only
        axis_pt_gen: 0
        axis_ptb_gen: 4 # non-prompt sparses only
    input:
        files: []
        is_mc: True
        event_histogram: eventselection-run3/luminosity/hCounterTVXafterBCcuts
        collision_histogram: hf-candidate-creator-3prong/hCollisionsCentOcc
        sparses:
        -   type: reco
            path: hf-task-ds/Data/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Ds/Prompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Ds/NonPrompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Dplus/Prompt/hSparseMass
        -   type: reco
            path: hf-task-ds/MC/Dplus/NonPrompt/hSparseMass
        -   type: gen
            path: hf-task-ds/MC/Ds/Prompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Ds/NonPrompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Dplus/Prompt/hSparseGen
        -   type: gen
            path: hf-task-ds/MC/Dplus/NonPrompt/hSparseGen

    weights:
        pt: # prompt weighted vs D pT, non-prompt vs pT(B); adds <sparse>_reweighted next to each MC sparse
            apply: False
            file_name: ''
            hist_names:
                Ds:
                    Prompt: ''
                    NonPrompt: ''
                Dplus:
                    Prompt: ''
                    NonPrompt: ''
